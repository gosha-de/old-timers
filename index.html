<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Old-Timers — music timeline game</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ░░ SETUP ░░ -->
  <section id="setup" class="screen active">
    <div class="logo" aria-hidden="true"></div>
    <div class="lang-picker" id="lang-picker">
      <button data-lang="ru">Ру</button>
      <button data-lang="en">En</button>
    </div>
    <div class="setup-card">
      <h1 data-i18n="tagline">Hear a song. Guess where it fits on your timeline.</h1>

      <div class="field">
        <label data-i18n="musicFrom">Music from</label>
        <div class="choices" id="pool-choices">
          <button class="chip" data-pool="RU" data-i18n="poolRU">Russia</button>
          <button class="chip" data-pool="INT" data-i18n="poolINT">International</button>
          <button class="chip active" data-pool="BOTH" data-i18n="poolBOTH">Both</button>
        </div>
      </div>

      <div class="field">
        <label data-i18n="players">Players</label>
        <div class="choices" id="player-choices">
          <button class="chip active" data-players="1">1</button>
          <button class="chip" data-players="2">2</button>
          <button class="chip" data-players="3">3</button>
          <button class="chip" data-players="4">4</button>
        </div>
      </div>

      <div class="field">
        <label><span data-i18n="cardsToWin">Cards to win:</span> <strong id="target-label">7</strong></label>
        <input type="range" id="target" min="3" max="12" value="7" />
      </div>

      <button id="start" class="primary" data-i18n="start">Start game</button>
      <p class="poolinfo" id="poolinfo"></p>
    </div>
  </section>

  <!-- ░░ GAME ░░ -->
  <section id="game" class="screen">
    <div class="gamehead">
      <button id="home" class="logo" aria-label="Back to start"></button>
      <div id="turn-banner" class="game-title">Player 1</div>
      <div id="turn-sub" class="game-sub"></div>
      <button id="quit" class="exit-btn" aria-label="Quit game">✕</button>
    </div>

    <div class="timeline-wrap">
      <div id="boards" class="boards"></div>
    </div>

    <div class="play-area">
      <div id="mystery" class="mystery">
        <div class="mystery-info">
          <div id="mystery-state" data-i18n="mysteryQ">What year is this track from?</div>
          <div class="audio-controls">
            <button id="play" class="primary play-btn" data-i18n="play">▶ Play</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ░░ REVEAL ░░ -->
  <div id="reveal" class="modal">
    <div class="modal-card">
      <div id="reveal-verdict" class="verdict"></div>
      <div class="reveal-year" id="reveal-year"></div>
      <img id="reveal-art" class="reveal-art" alt="" hidden />
      <div class="reveal-title" id="reveal-title"></div>
      <div class="reveal-artist" id="reveal-artist"></div>
      <button id="next" class="primary" data-i18n="next">Next →</button>
    </div>
  </div>

  <!-- ░░ GAME OVER ░░ -->
  <section id="gameover" class="screen">
    <div class="setup-card">
      <h1>🏆</h1>
      <div id="winner" class="winner"></div>
      <div id="final-scores" class="scores"></div>
      <button id="again" class="primary" data-i18n="playAgain">Play again</button>
    </div>
  </section>

  <audio id="player" preload="auto"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
